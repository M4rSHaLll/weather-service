services:
  pg:
    image: postgres:18.0
    restart: always
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "a864653K"
      POSTGRES_DB: "weather"
    ports:
      - "54321:5432"
    volumes:
      - pg_volume:/var/lib/postgresql
      - ./migrations:/docker-entrypoint-initdb.d:ro

volumes:
  pg_volume: {}
